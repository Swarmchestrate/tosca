tosca_definitions_version: tosca_2_0

description: Example CDT for demonstrators

metadata:
  name: cap-edges-fuelics
  author: University of Westminster
  date: 2026-02-18
  version: 0.1
  tags:
    - provider: fuelics

imports:
  - namespace: swch
    url: https://raw.githubusercontent.com/Swarmchestrate/tosca/refs/heads/main/profiles/eu.swarmchestrate/profile.yaml

node_types:

  USTEdge:
    derived_from: swch:EdgeCapacity
    description: >
      An base edge node from the UST provision
    capabilities:
      host:
        properties:
          num-cpus:
            default: 4
          mem-size:
            default: 8
          disk-size:
            default: 60
          bandwidth:
            default: 1000
      os:
        properties:
          type:
            default: linux
          version:
            default: "22.04"
          distribution:
            default: raspbian
      resource:
        properties:
          provider:
            default: UST
          capacity-provider:
            default: UST
      network:
        properties:
          ipv4_enabled:
            default: True
          ipv6_enabled:
            default: True
          type:
            default: 4G
      pricing:
        properties:
          cost:
            default: 0.00
      locality:
        properties:
          continent:
            default: Europe
          country:
            default: Greece
          city:
            default: Athens
      energy:
        properties:
          powered-type:
            default: solar
          energy-type:
            default: green
          consumption:
            default: 5.00

  # 2 Raspberry Pis with RPi 5
  ust-edge-rpi5:
    derived_from: USTEdge
    description: >
      A Raspberry Pi 5 edge node for the Digital Twin demonstrator
    capabilities:
      host:
        properties:
          num-cpus:
            default: 4
          mem-size:
            default: 8
          disk-size:
            default: 60
          bandwidth:
            default: 1000
          architecture:
            default: arm64

  # 5 Raspberry Pis with RPi 2
  ust-edge-rpi2:
    derived_from: USTEdge
    description: >
      A Raspberry Pi 2 edge node for the Digital Twin demonstrator
    capabilities:
      host:
        properties:
          num-cpus:
            default: 4
          mem-size:
            default: 1
          disk-size:
            default: 60
          bandwidth:
            default: 1000
          architecture:
            default: arm/v7

service_template:
  node_templates:

    edge-rpi-5-1:
      type: ust-edge-rpi5
      description: >
        A Raspberry Pi 5 edge node for the Digital Twin demonstrator
      properties:
        ip: 192.168.1.11

    edge-rpi-5-2:
      type: ust-edge-rpi5
      description: >
        A Raspberry Pi 5 edge node for the Digital Twin demonstrator
      properties:
        ip: 192.168.1.12

    edge-rpi-2-1:
      type: ust-edge-rpi2
      description: >
        A Raspberry Pi 2 edge node for the Digital Twin demonstrator
      properties:
        ip: 192.168.1.21

    edge-rpi-2-2:
      type: ust-edge-rpi2
      description: >
        A Raspberry Pi 2 edge node for the Digital Twin demonstrator
      properties:
        ip: 192.168.1.22

    edge-rpi-2-3:
      type: ust-edge-rpi2
      description: >
        A Raspberry Pi 2 edge node for the Digital Twin demonstrator
      properties:
        ip: 192.168.1.23

    edge-rpi-2-4:
      type: ust-edge-rpi2
      description: >
        A Raspberry Pi 2 edge node for the Digital Twin demonstrator
      properties:
        ip: 192.168.1.24

    edge-rpi-2-5:
      type: ust-edge-rpi2
      description: >
        A Raspberry Pi 2 edge node for the Digital Twin demonstrator
      properties:
        ip: 192.168.1.25
