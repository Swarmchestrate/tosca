[project]
name = "Sardou"
dynamic = ["version"]
description = "Sardou TOSCA Library"
readme = "README.md"
authors = [
    { name="Jay DesLauriers", email="j.deslauriers@westminster.ac.uk" },
    { name="Prachi Bhatt", email="p.bhatt1@westminster.ac.uk" }
]
dependencies = [
    "ruamel-yaml",
]
requires-python = ">=3.12"

[project.scripts]
sardou = "sardou.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "mkdocs-material>=9.7.1",
    "pytest>=9.0.2",
    "ruff>=0.14.13",
    "ty>=0.0.12",
]

[tool.ruff.lint]
extend-select = ["I"]
