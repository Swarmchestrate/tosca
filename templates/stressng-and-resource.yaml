tosca_definitions_version: tosca_2_0

description: stressng on Swarmchestrate

imports:
- namespace: swch
  url: https://raw.githubusercontent.com/Swarmchestrate/tosca/refs/heads/main/profiles/eu.swarmchestrate/profile.yaml

service_template:

  node_templates:

    swarm:
      type: swch:Swarm
      directives:
      - substitute
    
    stressng:
      type: swch:Microservice
      properties:
        image: docker.io/gunjank05/stress-ng
        replicas: 1
        labels:
          app: stressng
          service: stressng
        command:
        - stress-ng
        args:
        - --cpu
        - "1"
        - --vm
        - "1"
        - --vm-bytes
        - "256M"
        - --timeout
        - "3600s"
        - --metrics-brief
      requirements:
      - host:       
          node_filter:
            $and:
              - $equal:
                  - $get_property: [ SELF, TARGET, CAPABILITY, host, num-cpus ]
                  - 4
              - $equal:
                  - $get_property: [ SELF, TARGET, CAPABILITY, locality, city ]
                  - london
              - $equal:
                  - $get_property: [ SELF, TARGET, CAPABILITY, resource, type ]
                  - cloud # or edge
              - $equal:
                  - $get_property: [ SELF, TARGET, CAPABILITY, host, architecture ]
                  - x86_64 # or arm64

    
  policies:
    - energy:
        type: swch:QoS.Energy.Budget
        properties:
          priority: 0.5  # Between 0 and 1, where 1 is the highest priority
          target: 40      # watts per hour

    - cost:
        type: swch:QoS.Cost.Budget
        properties:
          priority: 0.5  # Between 0 and 1, where 1 is the highest priority
          target: 2       # $ per hour

    - bandwidth:
        type: swch:QoS.Performance.Bandwidth
        properties:
          priority: 0.5  # Between 0 and 1, where 1 is the highest priority
          target: 800     # Mbps

    - latency:
        type: swch:QoS.Performance.Latency
        properties:
          priority: 0.5  # Between 0 and 1, where 1 is the highest priority
          target: 70     # time (ms)
