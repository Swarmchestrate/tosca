tosca_definitions_version: tosca_2_0

description: UoW AWS Capacity Def

metadata:
  name: cap-aws-uow
  author: University of Westminster
  date: 2026-02-26
  version: 0.1
  tags:
  - provider: uow
  kind: RDT

imports:
- namespace: swch
  url: https://raw.githubusercontent.com/Swarmchestrate/tosca/refs/heads/main/profiles/eu.swarmchestrate/profile.yaml

node_types:
  UoWBase:
    derived_from: swch:EC2Capacity
    description: "An base compute node from the UoW AWS provision\n"
    properties:
      security_groups:
        default:
        - 0eb63f2b-b656-47a1-a0e7-3da0a993379e
    capabilities:
      host:
        properties:
          disk-size:
            default: 8
          bandwidth:
            default: 1000
      os:
        properties:
          type:
            default: linux
      resource:
        properties:
          provider:
            default: UoW
          capacity-provider:
            default: UoW
      network:
        properties:
          ipv4_enabled:
            default: true
          ipv6_enabled:
            default: false
          type:
            default: ethernet
      locality:
        properties:
          continent:
            default: Europe
          country:
            default: United Kingdom
          city:
            default: London
      energy:
        properties:
          powered-type:
            default: mains-powered
          energy-type:
            default: non-green

service_template:
  node_templates:
    ra-sztaki-cloud-hu_swarm2_details_v1_t2-large-ubuntu-uow:
      description: Large compute node on the custom UoW image
      type: UoWBase
      properties:
        ami: ami-customuow
        instance_type: t2.large
        ssh_user: ubuntu
        key_name: g-key
        ingress-rules:
        - from: 80
          protocol: TCP
          to: 80
      capabilities:
        capacity:
          properties:
            instances: 4
        host:
          properties:
            num-cpus: 2
            mem-size: 8
        os:
          properties:
            version: uow-2204
            distribution: ubuntu
        pricing:
          properties:
            cost: 0.2
        energy:
          properties:
            consumption: 0.1
    ra-sztaki-cloud-hu_swarm2_reviews_v1_t2-medium:
      type: UoWBase
      properties:
        ami: ami-amalinux
        instance_type: t2.medium
        ssh_user: ec2-user
        key_name: g-key
      capabilities:
        capacity:
          properties:
            instances: 4
        host:
          properties:
            num-cpus: 4
            mem-size: 8
        os:
          properties:
            version: AL2023
            distribution: amazon
        pricing:
          properties:
            cost: 0.2
        energy:
          properties:
            consumption: 0.1

