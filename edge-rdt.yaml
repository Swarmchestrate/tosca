tosca_definitions_version: tosca_2_0

description: Fuelics Edges Capacity Def

metadata:
  name: cap-edges-fuelics
  author: University of Westminster
  date: 2026-02-18
  version: 0.1
  tags:
  - provider: fuelics
  kind: RDT

imports:
- namespace: swch
  url: https://raw.githubusercontent.com/Swarmchestrate/tosca/refs/heads/main/profiles/eu.swarmchestrate/profile.yaml

node_types:
  FuelicsEdge:
    derived_from: swch:EdgeCapacity
    description: "An base edge node from the Fuelics provision\n"
    capabilities:
      host:
        properties:
          num-cpus:
            default: 2
          mem-size:
            default: 2
          disk-size:
            default: 20
          bandwidth:
            default: 1000
      os:
        properties:
          type:
            default: linux
          version:
            default: '22.04'
          distribution:
            default: raspbian
      resource:
        properties:
          provider:
            default: Fuelics
          capacity-provider:
            default: Fuelics
      network:
        properties:
          ipv4_enabled:
            default: false
          ipv6_enabled:
            default: false
          type:
            default: 4G
      pricing:
        properties:
          cost:
            default: 0.0
      locality:
        properties:
          continent:
            default: Europe
          country:
            default: Greece
          city:
            default: Athens
      energy:
        properties:
          powered-type:
            default: battery-powered
          energy-type:
            default: non-green
          consumption:
            default: 0.1

service_template:
  node_templates:
    ra-fuelics-cloud-hu_swarm1_details_v1_edge-device-a2bc:
      type: FuelicsEdge
      properties:
        ip: 192.168.1.100
        ssh_user: pi
        key_name: fuelics_key
        ssh_auth_method: key
        ingress-rules:
        - from: 80
          protocol: TCP
          to: 80

