##########################################################################
# This file contains MiCADO Profile Policy type definitions.
##########################################################################

tosca_definitions_version: tosca_2_0

profile: eu.swarmchestrate:0.1

metadata:
  template_name: policy.yaml
  template_author: University of Westminster
  template_version: 0.1

description: MiCADO Profile policy type definitions

imports:
- url: https://raw.githubusercontent.com/Swarmchestrate/tosca/refs/heads/main/profiles/eu.swarmchestrate/app.yaml

node_types:

  AppOnly:
    description: >
      A node type representing an application as a whole. Not to be
      used directly in a service template. Used to enforce no-targets
      on ApplicationPolicy.

policy_types:

  ApplicationPolicy:
    description: >
      Base policy type for targeting an entire application.
    targets: [ AppOnly ]

  MicroservicePolicy:
    description: >
      Base policy type for targeting specific microservices.
    targets: [ Microservice ]

  Scheduling:
    derived_from: MicroservicePolicy
    description: >
      Policy type for scheduling.

  Scheduling.Colocation:
    derived_from: Scheduling
    description: >
      Policy type for colocating multiple microservices on a specific host.

  Reconfiguration:
    derived_from: MicroservicePolicy
    description: >
      Policy type for reconfiguring an application at runtime.
    properties:
      period_check_slo:
        type: integer
        required: false
        description: >
          Interval in seconds at which the SLO constraints are checked for
          violations.
      period_evaluation:
        type: integer
        required: false
        description: >
          Interval in seconds at which the reconfiguration rule is evaluated.
      period_cooldown:
        type: integer
        required: false
        description: >
          Minimum interval in seconds between consecutive reconfigurations.
      constants:
        type: map
        required: false
        entry_schema: string
        description: >
          Constant values that can be used in the reconfiguration policy.
      rule:
        type: string
        required: true
        description: >
          The reconfiguration rule, expressed as a multi-line string.

  Forecast:
    derived_from: MicroservicePolicy
    description: >
      Policy type for predicting the future values of monitored metrics.
    properties:
      metrics:
        type: list
        required: true
        entry_schema: string
        description: >
          Names of the metrics to predict, declared by the targeted microservices.
      resolution:
        type: integer
        required: true
        description: >
          Interval in seconds that values are averaged into before prediction.
      forecast_duration:
        type: integer
        required: true
        description: >
          How far ahead predictions are needed, in seconds.
      lookback_duration:
        type: integer
        required: false
        description: >
          How much recent history each prediction is based on, in seconds.
      history_duration:
        type: integer
        required: false
        description: >
          How much past data to retain for training, in seconds.
      retrain_interval:
        type: integer
        required: false
        description: >
          How often the model is retrained, in seconds.
      coverage:
        type: float
        required: false
        description: >
          Proportion of values falling inside the predicted interval, 0 to 1.
      pipeline:
        type: string
        required: false
        description: >
          Forecasting pipeline to use, overriding the platform's choice.

  RegistryLogin:
    derived_from: ApplicationPolicy
    description: >
      Policy type for logging into a container registry.
    properties:
      username:
        type: string
        required: true
        description: >
          The username for the container registry.
      password:
        type: string
        required: true
        description: >
          The password or token for the container registry.
      registry_url:
        type: string
        required: true
        description: >
          The URL of the container registry.

  QoS:
    derived_from: ApplicationPolicy
    description: >
      Quality of Service (QoS) policies for applications. Cannot target a
      specific Microservice.
    properties:
      priority:
        type: float
        required: false
        description: >
          Priority level of the application (higher number means higher priority).
      target:
        type: integer
        required: false
        description: >
          Target value for the QoS metric.

  QoS.Energy.Budget:
    description: >
      Energy policy type
    derived_from: QoS

  QoS.Cost.Budget:
    description: >
      Cost policy type
    derived_from: QoS

  QoS.Performance.Bandwidth:
    description: >
      Bandwidth policy type
    derived_from: QoS

  QoS.Performance.Latency:
    description: >
      Latency policy type
    derived_from: QoS
