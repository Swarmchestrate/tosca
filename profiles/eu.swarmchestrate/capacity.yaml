##########################################################################
# This file contains MiCADO Profile Capacity type definitions.
##########################################################################

tosca_definitions_version: tosca_2_0

profile: eu.swarmchestrate:0.1

metadata:
  template_name: capacity.yaml
  template_author: University of Westminster
  template_version: 0.1

description: MiCADO Profile capacity type definitions


data_types:
  PortRules:
    properties:
      to:
        type: integer
        required: true
        description: Start of port range
      from:
        type: integer
        required: true
        description: End of port range
      protocol:
        type: string
        required: true
        description: Protocol (e.g., TCP, UDP)
      source:
        type: string
        required: false
        description: Source IP or CIDR for the port rule

capability_types:
  HostCap:
    properties:
      num-cpus:
        metadata:
          gui_name: capacity_instance_type.cpu
        type: integer
        required: true
        description: Number of vCPUs
      mem-size:
        metadata:
          gui_name: capacity_instance_type.ram_gb
        type: integer
        required: true
        description: Memory size (GB)
      disk-size:
        metadata:
          gui_name: capacity_instance_type.storage_gb
        type: integer
        required: true
        description: Disk size (GB)
      bandwidth:
        type: integer
        required: true
        description: Network bandwidth (Mbps)
      architecture:
        metadata:
          gui_name: capacity_instance_type.architecture
        type: string
        required: false
        description: CPU architecture (e.g., x86_64, arm64)

  CapacityInstanceCap:
    properties:
      instances:
        metadata:
          gui_name: capacity_instance_type.quota
        type: integer
        required: false
        description: >
          Number of instances of this type offered by the capacity 

  CapacityCap:
    properties:
      num-cpus:
        metadata:
          gui_name: capacity_resource_quota.cpu
        type: integer
        required: false
        description: Number of vCPUs offered by the capacity
      mem-size:
        metadata:
          gui_name: capacity_resource_quota.ram_gb
        type: integer
        required: false
        description: Memory size (GB) offered by the capacity
      disk-size:
        metadata:
          gui_name: capacity_resource_quota.storage_gb
        type: integer
        required: false
        description: Disk size (GB) offered by the capacity
      bandwidth:
        type: integer
        required: false
        description: Network bandwidth (Mbps) offered by the capacity

  OSCap:
    properties:
      type:
        metadata:
          gui_name: capacity_operating_system.os_name
        type: string
        required: true
        description: Operating system type (e.g. Linux, Windows)
      version:
        type: string
        required: true
        description: Operating system version
      distribution:
        type: string
        required: true
        description: Operating system distribution (e.g. Ubuntu, Amazon Linux)

  NetworkCap:
    properties:
      type:
        metadata:
          gui_name: capacity_new.connectivity_type
        type: string
        required: true
        description: Network type (e.g. 4G, 5G, Ethernet)
      ipv6_enabled:
        type: boolean
        required: true
        description: Whether IPv6 is enabled
      ipv4_enabled:
        type: boolean
        required: true
        description: Whether IPv4 is enabled
      subnet:
        type: string
        required: false
        description: Subnet CIDR
      explicit-tcp-allow:
        type: list
        required: true
        description: TCP ports explicitly allowed. Defaults to ALL.
        entry_schema: string
        default: [ ALL ]
      explicit-udp-allow:
        type: list
        required: true
        description: UDP ports explicitly allowed. Defaults to ALL.
        entry_schema: string
        default: [ ALL ]

  ResourceCap:
    properties:
      provider:
        metadata:
          gui_name: capacity_new.resource_provider
        type: string
        required: true
        description: Resource provider. Typically a cloud provider or, in the case of edge, an organisation (e.g. aws, openstack, uow)
      capacity-provider:
        metadata:
          gui_name: capacity_new.capacity_provider
        type: string
        required: true
        description: Capacity provider, always an organisation (e.g. uow, sztaki, fuelics)
      type:
        metadata:
          gui_name: capacity_new.resource_type
        type: string
        required: true
        description: Resource type (e.g. cloud, edge)
      compute:
        type: string
        required: true
        description: Compute service type (e.g., nova, ec2)
      labels:
        type: map
        required: false
        entry_schema: string
        description: Any labels associated with the resource

  PricingCap:
    properties:
      cost:
        metadata:
          gui_name: capacity_instance_type.price_per_hr
        type: float
        required: true
        description: Cost per hour in EUR

  LocalityCap:
    properties:
      continent:
        metadata:
          gui_name: locality.continent
        type: string
        required: true
        description: Continent where the resource is located
      country:
        metadata:
          gui_name: locality.country
        type: string
        required: true
        description: Country where the resource is located
      city:
        metadata:
          gui_name: locality.city
        type: string
        required: true
        description: City where the resource is located

  EnergyCap:
    properties:
      consumption:
        metadata:
          # NOTE: source column is kWh, this property is documented as watts per
          # hour. Unit conversion needs resolving before this binding is used.
          gui_name: capacity_instance_type.energy_consumption_kwh
        type: float
        required: true
        description: Energy consumption in watts per hour
      powered-type:
        metadata:
          gui_name: capacity_new.powered_type
        type: string
        required: false
        description: Type of power used (e.g., renewable, non-renewable)
      energy-type:
        metadata:
          gui_name: capacity_new.energy_type
        type: string
        required: false
        description: Specific type of energy (e.g., solar, wind, coal)

  TrustCap:
    properties:
      level:
        metadata:
          # NOTE: source column is text, this property is a float.
          gui_name: capacity_new.trust
        type: float
        required: true
        description: Trust level
        default: 0.5


node_types:
  
  OverallCapacity:
    description: >
      Used for specfying the total available resource offered from a capacity.
    capabilities:
      capacity:
        description: >
          Available raw compute resources (vCPUs, memory, disk, bandwidth).
        type: CapacityCap

  Capacity:
    description: >
      The base type for capacity nodes, representing a provider's offering.
    properties:
      ssh_port:
        type: integer
        required: false
        description: >
          SSH port for accessing the instance.
        default: 22
      ssh_user:
        type: string
        required: false
        description: >
          SSH user for accessing the instance.
      ingress-rules:
        metadata:
          alias: custom_ingress_ports
        type: list
        entry_schema: PortRules
        required: false
        description: Ingress port rules
      egress-rules:
        metadata:
          alias: custom_egress_ports
        type: list
        entry_schema: PortRules
        required: false
        description: Egress port rules
    capabilities:
      host:
        description: >
          Used to specify the hardware specification of a specific instance flavour
          in a capacity.
        type: HostCap
      capacity:
        description: >
          Used to specify the available resource offered from a capacity, in terms
          of number of instances of a given flavour.
        type: CapacityInstanceCap
      os:
        description: >
          Used to specify the operating system of a specific instance flavour in
          a capacity.
        type: OSCap
      network:
        description: >
          Used to specify network information of a specific instance flavour in
          a capacity.
        type: NetworkCap
      resource:
        description: >
          Used to specify higher-level information about the instance flavour being
          offered by the capacity.
        type: ResourceCap
      pricing:
        description: >
          Used to specify the cost of a specific instance flavour in a capacity.
        type: PricingCap
      locality:
        description: >
          Used to specify the location of a specific instance flavour in a capacity.
        type: LocalityCap
      energy:
        description: >
          Used to specify the energy consumption of a specific instance flavour in a capacity.
        type: EnergyCap
      trust:
        description: >
          Used to specify the trust level of a specific instance flavour in a capacity.
        type: TrustCap      
  
  CloudCapacity:
    description: >
      The Swarmchestrate Cloud Capacity Node
    derived_from: Capacity
    properties:
      cloud:
        type: string
        required: false
        description: >
          Cloud provider identifier.
    capabilities:
      resource:
        properties:
          type:
            description: >
              Setting a default, knowing that all instances of this type will be cloud-based.
            default: cloud

  EdgeCapacity:
    description: >
      The Swarmchestrate Edge Capacity Node
    derived_from: Capacity
    properties:
      ip:
        metadata:
          alias: edge_device_ip
        type: string
        required: false
        description: IP of edge node        
      local_ip:
        metadata:
          alias: edge_device_local_ip
        type: string
        required: false
        description: Local IP of edge node        
      credentials:
        type: map
        required: false
        description: Map of credentials (e.g. token, basic auth)
        entry_schema: string
      key_name:
        metadata:
          alias: ssh_key
        type: string
        required: false
        description: >
          The name of the SSH key pair used to access the instance.
      ssh_auth_method:
        type: string
        required: false
        description: SSH authentication method (e.g. key, password)
    capabilities:
      capacity:
        properties:
          instances:
            description: >
              Each edge device can only provide a single 'instance', so this default is set.
            default: 1
      resource:
        properties:
          type:
            description: >
              Setting a default, knowing that all instances of this type will be edge-based.
            default: edge
          compute:
            description: >
              Setting the default to edge, as above.
            default: edge

  OpenStackCapacity:
    derived_from: CloudCapacity
    description: >
      A Nova compute node from OpenStack
    properties:
      cloud:
        default: openstack
        description: >
          Setting the cloud property default to openstack.
      image_id:
        metadata:
          alias: openstack_image_id
        type: string
        required: true
        description: >
          The ID of the image used to launch the instance.
      network_id:
        type: string
        required: true
        description: >
          The ID of the network connected by this instance
      flavor_name:
        metadata:
          alias: openstack_flavor_id
        type: string
        required: true
        description: >
          The type of OpenStack instance (e.g., m2.medium) specifying compute resources.
      volume_size:
        type: integer
        required: true
        description: >
          Size of instance disk volume in GB
      project_id:
        type: string
        required: false
        description: >
          OpenStack project ID
      use_block_device:
        type: boolean
        required: false
        description: Whether to use a block device for the instance.
      key_name:
        metadata:
          alias: ssh_key
        type: string
        required: false
        description: >
          The name of the SSH key pair used to access the instance.
      security_group:
        metadata:
          alias: security_group_id
        type: string
        required: false
        description: >
          A security group ID that controls inbound and outbound traffic for the instance.
      security_groups:
        metadata:
          alias: security_group_ids
        type: list
        required: false
        entry_schema: string
        description: >
          A list of security group IDs that control inbound and outbound traffic for the instance.
    capabilities:
      resource:
        properties:
          compute:
            description: >
              Setting a default, given that OpenStack Nova is providing the compute.
            default: nova

  EC2Capacity:
    derived_from: CloudCapacity
    description: >
      An base EC2 compute node from AWS
    properties:
      cloud:
        default: aws
        description: >
          Setting the cloud property default to aws.
      ami:
        type: string
        required: true
        description: >
          The Amazon Machine ID of the image used to launch the instance.
      instance_type:
        type: string
        required: true
        description: >
          The AWS instance type (e.g., t2.micro) specifying compute resources.
      key_name:
        metadata:
          alias: ssh_key
        type: string
        required: false
        description: >
          The name of the SSH key pair used to access the instance.
      security_group:
        metadata:
          alias: security_group_id
        type: string
        required: false
        description: >
          A security group ID that controls inbound and outbound traffic for the instance.
      security_groups:
        metadata:
          alias: security_group_ids
        type: list
        required: false
        entry_schema: string
        description: >
          A list of security group IDs that control inbound and outbound traffic for the instance.

    capabilities:
      resource:
        properties:
          compute:
            description: >
              Setting a default, given that AWS EC2 is providing the compute.
            default: ec2
